# nginx site for ExtendedTimetable. install.sh writes it once to
# /etc/nginx/sites-available/extt with SERVER_NAME replaced and never
# overwrites it, so the TLS lines certbot adds survive upgrades:
#   certbot --nginx -d example.org --redirect --hsts
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Forms and JSON bodies are small; the app limits them too.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# nginx site for ExtendedTimetable. install.sh writes it once to
# /etc/nginx/sites-available/extt with SERVER_NAME replaced and never
# overwrites it, so the TLS lines certbot adds survive upgrades:
#   certbot --nginx -d example.org --redirect --hsts
# Behind a Cloudflare Tunnel no certificate is needed: route the tunnel to
# http://localhost:80 (docs/deploy.md).

# Connections to the app are kept open and reused rather than made anew
# for every request.
upstream extt {
    server 127.0.0.1:8080;
    keepalive 8;
}

# Invite links (/join/<token>) carry the token that lets anyone join a
# group, so requests for them, and those sent from them (the page's files
# and the page after joining name it as the Referer), are left out of the
# access log. The app logs them with the token cut out.
map "$uri $http_referer" $extt_access_log {
    ~/join/  0;
    default  1;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    access_log /var/log/nginx/access.log combined if=$extt_access_log;

    # Forms and JSON bodies are small; the app limits them too.
    client_max_body_size 1m;

    # A Cloudflare Tunnel's cloudflared connects from localhost; take the
    # visitor's address from the header Cloudflare sets. Only trusted for
    # local connections, so clients reaching nginx directly cannot fake it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Pages and JSON. The app sends stylesheets and scripts gzipped already,
    # and nginx leaves those as they are.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://extt;
        proxy_http_version 1.1;
        # Keep the connection to the app open (the upstream's keepalive).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app logs this ID with every line of the request. Set it here so
        # a client cannot choose it (the app trusts it with EXTT_TRUST_PROXY).
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}

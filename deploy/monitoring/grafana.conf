# systemd drop-in for Grafana, installed as
# /etc/systemd/system/grafana-server.service.d/extt.conf. Grafana listens on
# loopback only: reach it through an SSH tunnel or a Cloudflare Tunnel with
# Cloudflare Access in front (docs/deploy.md).
[Service]
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/extt.json
# The first admin password, generated once by install-monitoring.sh. Grafana
# reads it only when it creates its database; change it later in the UI.
EnvironmentFile=-/etc/grafana/extt-admin.env
# Grafana's public address (GF_SERVER_ROOT_URL), when one was given to
# install-monitoring.sh.
EnvironmentFile=-/etc/grafana/extt-url.env

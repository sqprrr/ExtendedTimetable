# Installed as /etc/grafana/provisioning/datasources/extt.yml. The fixed uid
# is what the dashboard refers to.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

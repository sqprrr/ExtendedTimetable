{{define "layout"}}<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · ExtendedTimetable</title>
  <link rel="stylesheet" href="/static/style.css">
  {{/* htmx would inject an inline <style>, which the CSP blocks. */}}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRFToken}}"}'>
  <header class="topbar">
    <a class="brand" href="/">ExtendedTimetable</a>
    <nav>
      {{if .Viewer}}
        <span class="muted">{{.Viewer.Username}}{{if .Viewer.IsSuperadmin}} · superadmin{{end}}</span>
        <form method="post" action="/logout" class="inline">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
          <button type="submit" class="link">Log out</button>
        </form>
      {{else}}
        <a href="/login">Log in</a>
        <a href="/register">Register</a>
      {{end}}
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}

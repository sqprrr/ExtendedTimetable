{{define "layout"}}<!doctype html>
<html lang="{{lang}}"{{if ne .Theme "system"}} data-theme="{{.Theme}}"{{end}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{template "title" .}} · ExtendedTimetable</title>
  <link rel="stylesheet" href="{{asset "style.css"}}">
  {{/* htmx would inject an inline <style>, which the CSP blocks. */}}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
  <script src="{{asset "htmx.min.js"}}" defer></script>
  <script src="{{asset "app.js"}}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRFToken}}"}'
      data-msg-save-failed="{{t "js.save_failed"}}" data-msg-offline="{{t "js.offline"}}">
  <a class="skip-link" href="#main">{{t "nav.skip"}}</a>
  {{if .Viewer}}
  <div class="app">
    {{template "sidebar" .}}
    {{template "topbar" .}}
    <main class="page {{template "mainClass" .}}" id="main" tabindex="-1">
      {{template "skeleton"}}
      {{template "content" .}}
    </main>
    {{template "bottomNav" .}}
  </div>
  {{else}}
  <div class="auth">
    <header class="auth-bar">
      <a class="wordmark" href="/">ExtendedTimetable</a>
      <div class="btn-row">
        {{if ne .Section "login"}}<a class="btn btn-ghost btn-sm" href="/login">{{t "nav.login"}}</a>{{end}}
        {{template "langSwitch" .}}
        {{template "themeSwitch" .}}
      </div>
    </header>
    <main class="auth-main {{template "mainClass" .}}" id="main">
      {{template "content" .}}
    </main>
  </div>
  {{end}}
  {{/* app.js shows failed htmx requests here. */}}
  <div class="toast" id="toast" role="status" aria-live="polite">{{icon "triangle-alert"}}<span></span></div>
</body>
</html>
{{end}}

{{/* mainClass is a page's class on <main> ("page-today", …). */}}
{{define "mainClass"}}{{end}}

{{/* sidebar is the navigation from 768px up. */}}
{{define "sidebar"}}
<aside class="sidebar"{{boost}}>
  <a class="wordmark" href="/">ExtendedTimetable</a>
  {{with .NavGroup}}
  <a class="group-switch" href="/" title="{{t "nav.my_groups"}}"><span class="name">{{.Name}}</span><span class="group-code">{{.Code}}</span></a>
  {{end}}
  <nav class="nav" aria-label="{{t "nav.sections"}}">
    {{with .NavGroup}}
    {{$g := print "/g/" .Code}}
    <a class="nav-item" href="{{$g}}"{{current $.Section "overview"}}>{{icon "house"}}<span>{{t "nav.today"}}</span></a>
    <a class="nav-item" href="{{$g}}/schedule"{{current $.Section "schedule"}}>{{icon "calendar-days"}}<span>{{t "nav.schedule"}}</span></a>
    <a class="nav-item" href="{{$g}}/homework"{{current $.Section "homework"}}>{{icon "list-checks"}}<span>{{t "nav.homework"}}</span></a>
    {{if .CanTrack}}<a class="nav-item" href="{{$g}}/grades"{{current $.Section "grades"}}>{{icon "graduation-cap"}}<span>{{t "nav.grades"}}</span></a>{{end}}
    <div class="nav-label">{{t "nav.group"}}</div>
    <a class="nav-item" href="{{$g}}/notes"{{current $.Section "notes"}}>{{icon "megaphone"}}<span>{{t "nav.notes"}}</span></a>
    <a class="nav-item" href="{{$g}}/links"{{current $.Section "links"}}>{{icon "link"}}<span>{{t "nav.links"}}</span></a>
    <a class="nav-item" href="{{$g}}/resources"{{current $.Section "resources"}}>{{icon "video"}}<span>{{t "nav.resources"}}</span></a>
    <a class="nav-item" href="{{$g}}/subjects"{{current $.Section "subjects"}}>{{icon "book-open"}}<span>{{t "nav.subjects"}}</span></a>
    <a class="nav-item" href="{{$g}}/members"{{current $.Section "members"}}>{{icon "users"}}<span>{{t "nav.members"}}</span></a>
    {{else}}
    <a class="nav-item" href="/"{{current $.Section "home"}}>{{icon "house"}}<span>{{t "nav.my_groups"}}</span></a>
    {{end}}
  </nav>
  <div class="sidebar-foot">
    <a class="nav-item" href="/feedback"{{current .Section "feedback"}}>{{icon "message-square"}}<span>{{t "nav.feedback"}}</span></a>
    {{if .Viewer.IsSuperadmin}}
    <a class="nav-item" href="/admin/groups"{{current .Section "admin_groups"}}>{{icon "users"}}<span>{{t "nav.admin_groups"}}</span></a>
    <a class="nav-item" href="/admin/feedback"{{current .Section "inbox"}}>{{icon "list-checks"}}<span>{{t "feedback.inbox"}}</span></a>
    {{end}}
    <div class="user-line">
      <span>{{.Viewer.Username}}{{with viewerRole .Viewer .NavGroup}} · {{.}}{{end}}</span>
      {{template "langSwitch" .}}
    </div>
    <div class="user-line">
      <span>{{t "theme.label"}}</span>
      {{template "themeSwitch" .}}
    </div>
    {{template "logout" .}}
  </div>
</aside>
{{end}}

{{/* topbar is the slim bar above the page on phones. */}}
{{define "topbar"}}
<header class="topbar"{{boost}}>
  <div class="topbar-group">
    {{with .NavGroup}}<a class="group-code" href="/" title="{{t "nav.my_groups"}}">{{.Code}}</a>
    {{else}}<a class="wordmark" href="/">ExtendedTimetable</a>{{end}}
  </div>
  {{template "langSwitchIcon" .}}
</header>
{{end}}

{{/* bottomNav is the phone navigation: the four everyday sections and More. */}}
{{define "bottomNav"}}
<nav class="bottom-nav" aria-label="{{t "nav.sections"}}"{{boost}}>
  {{with .NavGroup}}
  {{$g := print "/g/" .Code}}
  <a href="{{$g}}"{{current $.Section "overview"}}>{{icon "house"}}<span>{{t "nav.today"}}</span></a>
  <a href="{{$g}}/schedule"{{current $.Section "schedule"}}>{{icon "calendar-days"}}<span>{{t "nav.schedule"}}</span></a>
  <a href="{{$g}}/homework"{{current $.Section "homework"}}>{{icon "list-checks"}}<span>{{t "nav.homework_short"}}</span></a>
  {{if .CanTrack}}<a href="{{$g}}/grades"{{current $.Section "grades"}}>{{icon "graduation-cap"}}<span>{{t "nav.grades_short"}}</span></a>{{end}}
  <a href="{{$g}}/more"{{current $.Section "more" "notes" "links" "resources" "subjects" "members" "feedback" "inbox" "admin_groups" "home"}}>{{icon "menu"}}<span>{{t "nav.more"}}</span></a>
  {{else}}
  <a href="/"{{current $.Section "home"}}>{{icon "house"}}<span>{{t "nav.my_groups"}}</span></a>
  <a href="/feedback"{{current $.Section "feedback"}}>{{icon "message-square"}}<span>{{t "nav.feedback"}}</span></a>
  <a href="/more"{{current $.Section "more" "inbox" "admin_groups"}}>{{icon "menu"}}<span>{{t "nav.more"}}</span></a>
  {{end}}
</nav>
{{end}}

{{/* langSwitch offers the other language; the choice is kept in a cookie
   and, for signed-in users, in their account. */}}
{{define "langSwitch"}}
<form method="post" action="/lang" class="inline" hx-boost="false">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="hidden" name="back" value="{{.Back}}">
  {{if eq lang "en"}}
  <button type="submit" name="lang" value="uk" class="btn btn-ghost btn-sm" lang="uk">Українська</button>
  {{else}}
  <button type="submit" name="lang" value="en" class="btn btn-ghost btn-sm" lang="en">English</button>
  {{end}}
</form>
{{end}}

{{/* langSwitchIcon is langSwitch as an icon button, for the phone top bar. */}}
{{define "langSwitchIcon"}}
<form method="post" action="/lang" class="inline" hx-boost="false">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="hidden" name="back" value="{{.Back}}">
  {{if eq lang "en"}}
  <button type="submit" name="lang" value="uk" class="btn btn-ghost btn-icon" lang="uk" aria-label="Українська" title="Українська">{{icon "languages"}}</button>
  {{else}}
  <button type="submit" name="lang" value="en" class="btn btn-ghost btn-icon" lang="en" aria-label="English" title="English">{{icon "languages"}}</button>
  {{end}}
</form>
{{end}}

{{/* themeSwitch picks light, dark or the device's theme; the choice is kept
   like the language. The labels are visible only where there is room. */}}
{{define "themeSwitch"}}
<form method="post" action="/theme" class="theme-switch" hx-boost="false">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="hidden" name="back" value="{{.Back}}">
  <div class="segmented" role="group" aria-label="{{t "theme.label"}}">
    {{range themes}}
    <button type="submit" name="theme" value="{{.}}" aria-pressed="{{eq . $.Theme}}" title="{{t (print "theme." .)}}">
      {{if eq . "light"}}{{icon "sun"}}{{else if eq . "dark"}}{{icon "moon"}}{{else}}{{icon "monitor"}}{{end}}
      <span class="label">{{t (print "theme." .)}}</span>
    </button>
    {{end}}
  </div>
</form>
{{end}}

{{define "logout"}}
<form method="post" action="/logout" hx-boost="false">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <button type="submit" class="nav-item">{{icon "log-out"}}<span>{{t "nav.logout"}}</span></button>
</form>
{{end}}

{{/* skeleton stands in for the page while htmx loads the next one (see
   boost); it shows only when that takes a moment. */}}
{{define "skeleton"}}
<div class="page-skeleton" aria-hidden="true">
  <div class="sk-head"><span class="sk sk-title"></span><span class="sk sk-subtitle"></span></div>
  <div class="sk-card">
    <span class="sk sk-heading"></span>
    {{range 4}}<div class="sk-row"><span class="sk sk-dot"></span><span class="sk-lines"><span class="sk sk-line"></span><span class="sk sk-line sk-short"></span></span><span class="sk sk-tail"></span></div>{{end}}
  </div>
  <div class="sk-card">
    <span class="sk sk-heading"></span>
    {{range 2}}<div class="sk-row"><span class="sk sk-dot"></span><span class="sk-lines"><span class="sk sk-line"></span><span class="sk sk-line sk-short"></span></span><span class="sk sk-tail"></span></div>{{end}}
  </div>
</div>
{{end}}

{{define "title"}}{{t "register.title"}}{{end}}
{{define "content"}}
<section class="card narrow">
  <h1>{{t "register.title"}}</h1>
  {{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  {{if .JoinableGroups}}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>{{t "field.group"}}
      <select name="group" required>
        {{if ne (len .JoinableGroups) 1}}<option value="">{{t "register.choose_group"}}</option>{{end}}
        {{range .JoinableGroups}}
        <option value="{{.Code}}"{{if eq .Code $.Form.Group}} selected{{end}}>{{.Name}}{{if ne .Name .Code}} ({{.Code}}){{end}}</option>
        {{end}}
      </select>
    </label>
    <label>{{t "field.username"}}
      <input name="username" value="{{.Form.Username}}" autocomplete="username" minlength="3" maxlength="32" required autofocus>
      <small class="muted">{{th "register.username_hint"}}</small>
    </label>
    <label>{{t "field.password"}}
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
      <small class="muted">{{t "register.password_hint"}}</small>
    </label>
    <label>{{t "register.repeat_password"}}
      <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit">{{t "register.submit"}}</button>
  </form>
  {{else}}
  <p class="muted">{{t "register.closed"}}</p>
  {{end}}
  <p class="muted">{{th "register.have_account"}}</p>
</section>
{{end}}

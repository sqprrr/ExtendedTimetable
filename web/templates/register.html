{{define "title"}}Register{{end}}
{{define "content"}}
<section class="card narrow">
  <h1>Register</h1>
  {{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  {{if .JoinableGroups}}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>Group
      <select name="group" required>
        {{if ne (len .JoinableGroups) 1}}<option value="">Choose your group…</option>{{end}}
        {{range .JoinableGroups}}
        <option value="{{.Code}}"{{if eq .Code $.Form.Group}} selected{{end}}>{{.Name}}{{if ne .Name .Code}} ({{.Code}}){{end}}</option>
        {{end}}
      </select>
    </label>
    <label>Username
      <input name="username" value="{{.Form.Username}}" autocomplete="username" minlength="3" maxlength="32" required autofocus>
      <small class="muted">3–32 characters: latin letters, digits, <code>_ . -</code></small>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
      <small class="muted">At least 8 characters.</small>
    </label>
    <label>Repeat password
      <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit">Create account</button>
  </form>
  {{else}}
  <p class="muted">Registration is not open yet: no groups have been created.</p>
  {{end}}
  <p class="muted">Already registered? <a href="/login">Log in</a>.</p>
</section>
{{end}}
